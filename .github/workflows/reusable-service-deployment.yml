name: Service Deployment (Master Orchestration)

# INVEST-005/EPIC-017/FEATURE-002/US-007 — one deployment per service at a time.
#
# **`cancel-in-progress: false`, deliberately.** Cancelling the waiting run would be the same
# silence in a new place: a pipeline that never deployed and said nothing about it, which is the
# whole fault this story exists to remove. The second run waits and then does its work.
#
# **This does not replace the wait inside `reusable-ecs-codedeploy.yml`.** GitHub's concurrency ends
# when this workflow ends, and CodeDeploy's own termination wait outlives it — a deployment group
# can still be busy after the run that started it has finished. That is exactly what render #435 ran
# into, so both guards exist and neither is redundant.
concurrency:
  # Keyed by the deployment group, which is what a CodeDeploy run actually contends for — and
  # which exists as an input, unlike an 'environment' this workflow has never had.
  group: deploy-${{ inputs.codedeploy_application }}-${{ inputs.codedeploy_deployment_group }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      # Service Identity
      service_name:
        description: 'Service name (e.g., identity, render)'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      
      # ECS Configuration
      cluster_name:
        description: 'ECS cluster name'
        required: true
        type: string
      ecs_service_name:
        description: 'ECS service name'
        required: true
        type: string
      task_family:
        description: 'ECS task definition family'
        required: true
        type: string
      container_name:
        description: 'Container name in task definition'
        required: false
        type: string
        default: 'app'
      container_port:
        description: 'Container port'
        required: false
        type: number
        default: 3000
      
      # CodeDeploy Configuration
      codedeploy_application:
        description: 'CodeDeploy application name'
        required: true
        type: string
      codedeploy_deployment_group:
        description: 'CodeDeploy deployment group name'
        required: true
        type: string
      
      # Optional Configuration
      terraform_dir:
        description: 'Path to terraform directory'
        required: false
        type: string
        default: 'terraform'
      skip_tests:
        description: 'Skip lint, type-check, build, and test steps (tests already ran in CI)'
        required: false
        type: boolean
        default: false
      skip_terraform:
        description: 'Skip terraform deployment'
        required: false
        type: boolean
        default: false
      compose_files:
        description: 'Docker compose files (space separated)'
        required: false
        type: string
        default: 'docker-compose.yml docker-compose.ci.yml'
      appspec_path:
        description: 'Path to appspec.yaml'
        required: false
        type: string
        default: 'terraform/appspec.yaml'
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.7.0'
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
      use_ssh_agent:
        description: 'Whether to setup SSH agent for private Terraform modules'
        required: false
        type: boolean
        default: false
      secrets_bootstrap_cmd:
        description: 'Make target to bootstrap secrets (e.g. secrets-bootstrap). Empty = skip.'
        required: false
        type: string
        default: ''
      seed_command:
        description: 'Shell command to run as ECS one-off task for DB seeding (e.g. npx tsx prisma/seed.ts). Empty = skip.'
        required: false
        type: string
        default: ''
      deployment_config:
        description: 'CodeDeploy deployment config. Use ECSAllAtOnce for NLB, ECSLinear10PercentEvery1Minutes for ALB.'
        required: false
        type: string
        default: 'CodeDeployDefault.ECSLinear10PercentEvery1Minutes'
    
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
      NPM_TOKEN:
        description: 'NPM token for release-it (if needed)'
        required: false
      NODE_AUTH_TOKEN:
        description: >
          Token for installing private @tec42 packages from GitHub Packages during the Docker
          build. Pass secrets.GITHUB_TOKEN; this workflow already declares `packages: read`.
        required: false
      TF_MODULES_SSH_KEY:
        description: 'SSH private key for cloning private Terraform modules'
        required: false
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username to avoid pull rate limits'
        required: false
      DOCKER_HUB_TOKEN:
        description: 'Docker Hub access token'
        required: false
      GH_TOKEN:
        description: 'GitHub token for downloading assets from private repos'
        required: false

permissions:
  id-token: write    # Required for OIDC
  contents: write    # Required for release-it
  packages: read     # Required for package access

jobs:
  # ============================================================================
  # JOB 1: Release & ECR Push
  # ============================================================================
  release-ecr:
    name: Release & Push to ECR
    uses: ./.github/workflows/reusable-release-ecr.yml
    with:
      service_name: ${{ inputs.service_name }}
      ecr_repository: ${{ inputs.ecr_repository }}
      compose_files: ${{ inputs.compose_files }}
      aws_region: ${{ inputs.aws_region }}
      skip_tests: ${{ inputs.skip_tests }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # ============================================================================
  # JOB 2: Terraform Infrastructure (Optional)
  # ============================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: release-ecr
    if: ${{ !inputs.skip_terraform }}
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      terraform_dir: ${{ inputs.terraform_dir }}
      terraform_version: ${{ inputs.terraform_version }}
      aws_region: ${{ inputs.aws_region }}
      use_ssh_agent: ${{ inputs.use_ssh_agent }}
      image_tag: ${{ needs.release-ecr.outputs.version }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_MODULES_SSH_KEY: ${{ secrets.TF_MODULES_SSH_KEY }}

  # ============================================================================
  # JOB 3: Bootstrap Secrets (optional, idempotent)
  # ============================================================================
  bootstrap-secrets:
    name: Bootstrap Secrets
    needs: [release-ecr, deploy-infrastructure]
    if: |
      always() &&
      inputs.secrets_bootstrap_cmd != '' &&
      needs.release-ecr.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' ||
       needs.deploy-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: 🔑 Bootstrap Secrets
        run: make ${{ inputs.secrets_bootstrap_cmd }}

  # ============================================================================
  # JOB 4: Seed Database (optional, idempotent ECS one-off task)
  # ============================================================================
  seed-database:
    name: Seed Database
    needs: [release-ecr, deploy-infrastructure, bootstrap-secrets]
    if: |
      always() &&
      inputs.seed_command != '' &&
      needs.release-ecr.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' ||
       needs.deploy-infrastructure.result == 'skipped') &&
      (needs.bootstrap-secrets.result == 'success' ||
       needs.bootstrap-secrets.result == 'skipped')
    uses: ./.github/workflows/reusable-ecs-run-task.yml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      service_name: ${{ inputs.ecs_service_name }}
      task_family: ${{ inputs.task_family }}
      container_name: ${{ inputs.container_name }}
      command: ${{ inputs.seed_command }}
      aws_region: ${{ inputs.aws_region }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # ============================================================================
  # JOB 5: ECS CodeDeploy Blue/Green
  # ============================================================================
  deploy-ecs:
    name: Deploy to ECS
    needs: [release-ecr, deploy-infrastructure, bootstrap-secrets, seed-database]
    # Complex conditional:
    # - Run even if previous jobs failed (always())
    # - But only if release succeeded
    # - And release created something
    # - And infrastructure either succeeded or was skipped
    # - And bootstrap either succeeded or was skipped
    if: |
      always() && 
      needs.release-ecr.result == 'success' &&
      needs.release-ecr.outputs.has_release == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || 
       needs.deploy-infrastructure.result == 'skipped') &&
      (needs.bootstrap-secrets.result == 'success' ||
       needs.bootstrap-secrets.result == 'skipped') &&
      (needs.seed-database.result == 'success' ||
       needs.seed-database.result == 'skipped')
    uses: ./.github/workflows/reusable-ecs-codedeploy.yml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      service_name: ${{ inputs.ecs_service_name }}
      task_family: ${{ inputs.task_family }}
      container_name: ${{ inputs.container_name }}
      container_port: ${{ inputs.container_port }}
      ecr_repository: ${{ inputs.ecr_repository }}
      image_tag: ${{ needs.release-ecr.outputs.version }}
      codedeploy_application: ${{ inputs.codedeploy_application }}
      codedeploy_deployment_group: ${{ inputs.codedeploy_deployment_group }}
      appspec_path: ${{ inputs.appspec_path }}
      deployment_config: ${{ inputs.deployment_config }}
      aws_region: ${{ inputs.aws_region }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
