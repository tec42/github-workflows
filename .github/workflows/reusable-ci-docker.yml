name: CI with Docker Compose

on:
  workflow_call:
    inputs:
      compose_files:
        description: 'Docker compose files to use (space separated)'
        required: false
        type: string
        default: 'docker-compose.yml docker-compose.ci.yml'
      service_name:
        description: 'Docker compose service name'
        required: false
        type: string
        default: 'skeleton-service'
      test_target:
        description: >-
          Make target for the test step. Defaults to `test`. Pass `test-coverage` once a service
          actually meets its coverage threshold — until then the target fails on every run and the
          gate would block merges for a debt nobody incurred in that PR.
        required: false
        type: string
        default: 'test'
      integration_test_target:
        description: >-
          Make target for an additional integration test step. Empty by default, and the step is
          skipped when it is empty — services without an integration suite are unaffected.

          Kept separate from `test_target` rather than folded into it for two reasons. A coverage
          threshold is calibrated against the unit suite, and measuring integration runs too would
          move a number nobody changed. And `test_target` has to stay runnable without
          infrastructure, which this one does not.

          The caller's compose files must bring up whatever the suite needs — a database, a cache,
          anything the application connects to at boot. This workflow starts nothing on its own;
          the target it invokes is responsible for schema migration as well, so that no knowledge
          of the service's ORM lives here.
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username to avoid rate limits'
        required: false
      DOCKER_HUB_TOKEN:
        description: 'Docker Hub access token'
        required: false
      NODE_AUTH_TOKEN:
        description: >-
          Token for installing @tec42-scoped packages from GitHub Packages. Pass
          secrets.GITHUB_TOKEN and give the calling workflow `packages: read`.
          Only needed by services that depend on a private tec42 package.
        required: false

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Docker Hub Login (avoid rate limits)
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # A service's compose file binds Docker secrets to files that are gitignored by design — they
      # hold real values on a developer machine. A runner checks the repository out and has none of
      # them, so the bind mount fails before the container starts and every `make` target after this
      # dies with `invalid mount config for type "bind"`.
      #
      # **`secrets/`, and only that**, since 2026-09-07. For a few hours this step wrote
      # `docker/secrets/` as well, because the convention was genuinely split: `identity` binds
      # `./secrets/*.txt` while `service-blueprint` documented `docker/secrets/*.txt`, and a shared
      # workflow that serves one of two breaks the other — which it did, on the first pull request
      # the only service following the blueprint had ever had. The blueprint has since been corrected
      # to `secrets/`, so the second path has neither documentation nor a user, and writing it would
      # be a file nobody looks for.
      #
      # Two things worth keeping from that afternoon: clearing `secrets: []` in a service's CI
      # compose file does **not** work — Compose merges service-level `secrets` rather than replacing
      # them, unlike `volumes`. And if a service ever appears that binds a different path, fix it
      # there or in the blueprint; do not quietly widen this step again, because that is what hid the
      # disagreement in the first place.
      - name: 🔐 Create dummy secrets
        run: |
          mkdir -p secrets
          echo "test-password"   > secrets/database_password.txt
          echo "test-api-key"    > secrets/api_key.txt
          echo "test-jwt-secret" > secrets/jwt_secret.txt

      - name: 🐳 Build Docker images
        env:
          # Read by the service's compose file as a build argument. A BuildKit secret would keep
          # it out of the intermediate images too, but that needs the buildx plugin, and this
          # toolchain runs entirely in Docker with no local plugin installs. Verified: the token
          # appears in the history of the dev and builder stages, and NOT in the production image
          # that gets pushed — multi-stage keeps the final history to the last stage only.
          # Empty when the caller passes nothing, which is correct for services with no private
          # dependencies.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: docker compose $(echo "${{ inputs.compose_files }}" | sed 's/ / -f /g' | sed 's/^/-f /') build ${{ inputs.service_name }}

      - name: 🎨 Lint
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make lint

      - name: 🔍 Type check
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make type-check

      - name: 🏗️ Build
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make build

      - name: 🧪 Test
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make ${{ inputs.test_target }}

      # Skipped entirely when the caller passes nothing, which is every service that has no
      # integration suite. Runs after the unit step so a failure here is unambiguous: the fast
      # checks already passed, so what broke needs the real infrastructure to reproduce.
      - name: 🔗 Integration test
        if: inputs.integration_test_target != ''
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make ${{ inputs.integration_test_target }}
