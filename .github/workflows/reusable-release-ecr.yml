name: Release & Deploy to ECR

on:
  workflow_call:
    inputs:
      compose_files:
        description: 'Docker compose files to use (space separated)'
        required: false
        type: string
        default: 'docker-compose.yml docker-compose.ci.yml'
      service_name:
        description: 'Docker compose service name'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
      skip_tests:
        description: 'Skip lint, type-check, build, and test steps (useful for deploy-only workflows)'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
      NPM_TOKEN:
        description: 'NPM token for release-it (if needed)'
        required: false
      NODE_AUTH_TOKEN:
        description: >
          Token for installing private @tec42 packages from GitHub Packages during the Docker
          build. Pass secrets.GITHUB_TOKEN and give the calling workflow `packages: read`.
          Without it the build fails with a 401 while everything else looks fine.
        required: false
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username to avoid rate limits'
        required: false
      DOCKER_HUB_TOKEN:
        description: 'Docker Hub access token'
        required: false
      GH_TOKEN:
        description: 'GitHub token for downloading assets from private repos (e.g. render schema)'
        required: false
    outputs:
      version:
        description: 'Released version tag (e.g., 0.1.1)'
        value: ${{ jobs.deploy.outputs.version }}
      has_release:
        description: 'Whether a new release was created'
        value: ${{ jobs.deploy.outputs.has_release }}

permissions:
  id-token: write    # Required for OIDC
  contents: write    # Required for release-it to create tags/releases
  packages: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for release-it to analyze commits

      - name: 🔐 Create dummy secrets
        run: |
          mkdir -p secrets
          echo "test-password" > secrets/database_password.txt
          echo "test-api-key" > secrets/api_key.txt
          echo "test-jwt-secret" > secrets/jwt_secret.txt

      - name: 🐳 Docker Hub Login (avoid rate limits)
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🐳 Build Docker images
        env:
          # Read by the service's compose file as a build argument, same as in
          # reusable-ci-docker.yml. Empty when the caller passes nothing, which is correct for
          # services with no private dependencies.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: docker compose $(echo "${{ inputs.compose_files }}" | sed 's/ / -f /g' | sed 's/^/-f /') build ${{ inputs.service_name }}

      - name: 🎨 Lint
        if: ${{ !inputs.skip_tests }}
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make lint

      - name: 🔍 Type check
        if: ${{ !inputs.skip_tests }}
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make type-check

      - name: 🏗️ Build
        if: ${{ !inputs.skip_tests }}
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make build

      - name: 🧪 Test
        if: ${{ !inputs.skip_tests }}
        run: COMPOSE_FILES="${{ inputs.compose_files }}" make test

  release:
    name: Create Release
    needs: test
    if: |
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_release: ${{ steps.release.outputs.has_release }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Download shared release config
        run: |
          curl -sL -H 'Cache-Control: no-cache' -o .release-it.json \
            "https://raw.githubusercontent.com/tec42/github-workflows/main/shared/.release-it.json?$(date +%s)"
          echo "✅ Downloaded shared release-it config"
          cat .release-it.json

      - name: 📦 Install release-it and plugins
        run: npm install --no-save release-it @release-it/conventional-changelog

      - name: 🏷️ Run release-it
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Record last semver tag before release-it runs (excludes desktop-v* and other prefixed tags)
          PREV_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
          echo "Previous semver tag: ${PREV_TAG:-none}"

          # INVEST-005/EPIC-017/FEATURE-002/US-007 — **is this commit already released?**
          #
          # Asked *before* release-it runs, and that placement is the whole correction. A first
          # attempt at this pipeline creates the tag on a release commit it pushes; a re-run checks
          # out the SHA that triggered the workflow — the **merge commit**, one before that release
          # commit. So:
          #
          #   * no tag points at HEAD, so a check for one finds nothing;
          #   * release-it sees releasable commits and tries to create the tag again;
          #   * it fails with `fatal: tag '0.147.0' already exists`, and the step dies there.
          #
          # My first attempt at this fix asked "does a tag point at HEAD" *after* release-it, so it
          # never ran at all. Proven on ai-webstudio42 #216: the merge commit 4eb8ff4 carries no
          # tag, while 0.147.0 points at ea75337 — and 4eb8ff4 **is an ancestor of** 0.147.0.
          #
          # Containment is therefore the right question, not identity: *is the code at this commit
          # already inside a release?* The oldest release containing it is the one that shipped it.
          RELEASED_AS=""
          for TAG in $(git tag --list "[0-9]*.[0-9]*.[0-9]*" --sort=v:refname); do
            if git merge-base --is-ancestor HEAD "$TAG" 2>/dev/null; then
              RELEASED_AS="$TAG"
              break
            fi
          done

          if [ -n "$RELEASED_AS" ]; then
            # Pressing "Re-run" on a deploy workflow is a request to deploy. This commit's code is
            # already released, so that release is the version to deploy — and release-it is not run
            # at all, which also removes the confusing tag failure the old path produced.
            {
              echo "version=${RELEASED_AS}"
              echo "has_release=true"
            } >> "$GITHUB_OUTPUT"
            echo "♻️ This commit is already released as ${RELEASED_AS} — deploying ${RELEASED_AS}."
            echo "   (Nothing new is released: a re-run redeploys, it does not build a new version.)"
            exit 0
          fi

          # Run release-it in CI mode (no npm publish)
          npx release-it --ci --no-npm

          # Detect if a new semver tag was created (compare against previous)
          NEW_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREV_TAG" ]; then
            {
              echo "version=${NEW_TAG}"
              echo "has_release=true"
            } >> "$GITHUB_OUTPUT"
            echo "📦 Released version: ${NEW_TAG}"
            exit 0
          fi

          echo "has_release=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ No release created (no releasable commits since ${PREV_TAG:-beginning})"

  deploy:
    name: Deploy to ECR
    needs: [test, release]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_release: ${{ needs.release.outputs.has_release }}

    steps:
      - name: 🏷️ Determine version
        id: version
        run: |
          if [ "${{ needs.release.outputs.has_release }}" == "true" ]; then
            VERSION="${{ needs.release.outputs.version }}"
            echo "📦 Using release version: $VERSION"
          else
            VERSION="${{ github.ref_name }}-${GITHUB_SHA::8}"
            echo "🔧 Using branch version: $VERSION (no release created)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version || github.sha }}

      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Ensure ECR repository exists
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output text 2>/dev/null; then
            echo "✅ ECR repository already exists: $ECR_REPOSITORY"
          else
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE
            echo "✅ ECR repository created: $ECR_REPOSITORY"
            fi

      # **The second half of the re-run fix** (INVEST-005/EPIC-017/FEATURE-002/US-007).
      #
      # The first half taught the release step to recognise a commit that is already released and
      # to deploy that version instead of dying on the existing tag. It works — and the run still
      # could not finish, because everything below this line then built the image and pushed it
      # under a tag that is already in ECR:
      #
      #     tag invalid: The image tag '0.212.2' already exists in the 'render' repository
      #     and cannot be overwritten because the tag is immutable.
      #
      # The job fails there, so **CodeDeploy is skipped** and the symptom is the one the whole
      # story is about: merged, and not running. Measured on render's production deploy of
      # 2026-09-22 (runs 35785032484 and 35785059098, the same commit fifteen seconds apart).
      #
      # **The rule is simply that there is nothing to push.** A tag names one immutable thing: the
      # version for a release, and `branch-<sha8>` otherwise, both of which already identify the
      # source exactly. If ECR holds it, the image for this version exists and the deploy below can
      # have it.
      #
      # **What this deliberately gives up**, said here rather than discovered: a re-run no longer
      # rebuilds a tag that is already published. If a build ever produced a bad image, re-running
      # the pipeline will not replace it — that needs the tag deleted, or a new version. That is the
      # right trade: silently overwriting a released tag is worse than refusing to, and on an
      # immutable repository it was never possible anyway.
      - name: 🔎 Is this image already in ECR?
        id: existing_image
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          AWS_REGION: ${{ inputs.aws_region }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$VERSION" \
            --region "$AWS_REGION" \
            --output text >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "♻️ $ECR_REPOSITORY:$VERSION is already in ECR — skipping the build and the push."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "🏗️ $ECR_REPOSITORY:$VERSION is not in ECR yet — building it."
          fi

      - name: 🏗️ Build Docker image
        if: steps.existing_image.outputs.present != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # The released image is built here. Without the token this step fails with a 401 for
          # any service that depends on a private @tec42 package.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          # Build image with docker-compose (uses explicit image name from compose file)
          VERSION=$VERSION docker compose -f docker-compose.yml build ${{ inputs.service_name }}

          # Image name is explicitly set in docker-compose.yml as: {service_name}:${VERSION}
          echo "Built image: ${{ inputs.service_name }}:$VERSION"

          # Tag for ECR
          docker tag ${{ inputs.service_name }}:$VERSION $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

      - name: 🚀 Push to ECR
        if: steps.existing_image.outputs.present != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

          echo "✅ Pushed image:"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION"

      - name: 📊 Image summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### 🐳 Docker Image Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`$ECR_REGISTRY\`" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`$ECR_REPOSITORY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION\`" >> $GITHUB_STEP_SUMMARY
